name: Zips à jour

# Reconstruit dist/ à chaque modification de l'extension sur main, et le commit si besoin.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 outils/construire-zip.py
      - name: Commit des zips s'ils ont changé
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "Zips déjà à jour."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit -m "Zips : reconstruits pour la version $(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')"
            git push
          fi
