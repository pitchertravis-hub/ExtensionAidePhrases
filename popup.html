<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ZenText</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/Sortable.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V8M6 14l6-6 6 6M5 4h14"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  </svg>

  <!-- Vue 1 · Rubriques (160 px) -->
  <section id="view-rubriques" class="view v1">
    <header class="top">
      <div class="brand"><span class="mono-z">Z</span>ZenText</div>
      <div class="acts">
        <button class="ibtn" type="button" id="openNav" title="Navigation ID"><svg class="ico"><use href="#i-compass"/></svg></button>
        <button class="ibtn" type="button" id="settingsBtn" title="Réglages"><svg class="ico"><use href="#i-sliders"/></svg></button>
      </div>
    </header>

    <div class="blk">
      <span class="cap">Liste</span>
      <div class="row">
        <select class="select" id="listSelect" aria-label="Liste"></select>
        <button class="btn sq" type="button" id="listMenuBtn" title="Actions sur la liste"><svg class="ico"><use href="#i-dots"/></svg></button>
      </div>
    </div>

    <label class="field">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="searchBar" placeholder="Rechercher" aria-label="Rechercher une rubrique" autocomplete="off">
      <button class="ibtn" type="button" id="micBtn" title="Recherche vocale"><svg class="ico"><use href="#i-mic"/></svg></button>
    </label>

    <div class="head"><span class="cap">Rubriques</span><span class="cap" id="rubCount"></span></div>
    <ul class="rub" id="rubriqueList"></ul>
    <p class="empty" id="rubEmpty" hidden></p>

    <button class="btn solid" type="button" id="addRubriqueBtn"><svg class="ico"><use href="#i-plus"/></svg>Rubrique</button>
    <footer class="foot"><small id="backupInfo"></small><small id="version"></small></footer>
  </section>

  <!-- Vue 2 · Phrases (775 px) -->
  <section id="view-phrases" class="view v2" hidden>
    <header class="bar">
      <button class="ibtn" type="button" id="backBtn" title="Retour aux rubriques"><svg class="ico"><use href="#i-back"/></svg></button>
      <div class="title"><span class="cap" id="phListName"></span><h1><span id="rubriqueTitle"></span><em id="phCount"></em></h1></div>
      <label class="field"><svg class="ico"><use href="#i-search"/></svg><input id="phraseFilter" placeholder="Filtrer les phrases" aria-label="Filtrer les phrases" autocomplete="off"></label>
      <button class="btn solid" type="button" id="addPhraseBtn"><svg class="ico"><use href="#i-plus"/></svg>Phrase</button>
    </header>
    <div class="list" id="phraseList"></div>
    <p class="empty" id="phEmpty" hidden></p>
    <button class="add" type="button" id="addPhraseBtn2"><svg class="ico"><use href="#i-plus"/></svg>Ajouter une phrase</button>
  </section>

  <!-- Vue 3 · Navigation ID (310 px) -->
  <section id="view-nav" class="view v3" hidden>
    <header class="top">
      <button class="ibtn" type="button" id="backBtn2" title="Retour"><svg class="ico"><use href="#i-back"/></svg></button>
      <h1>Navigation ID</h1>
      <button class="ibtn" type="button" id="changeIntroBtn" title="Modifier la phrase d'introduction"><svg class="ico"><use href="#i-pen"/></svg></button>
    </header>
    <div class="sug">
      <label class="field"><svg class="ico"><use href="#i-search"/></svg><input id="navSearch" placeholder="Rechercher un menu" aria-label="Rechercher un menu" autocomplete="off"></label>
      <ul id="navResults" role="listbox" hidden></ul>
    </div>
    <ol class="path-steps">
      <li id="stepModule"><b>1</b><select class="select" id="module" aria-label="Module"></select></li>
      <li id="stepOption" hidden><b>2</b><select class="select" id="option" aria-label="Option"></select></li>
      <li id="stepSub" hidden><b>3</b><select class="select" id="subOption" aria-label="Sous-option"></select></li>
    </ol>
    <div class="ticket" id="navResult" hidden>
      <p id="navIntro"></p>
      <ol id="navPath"></ol>
      <footer><span id="navStatus"></span><button class="btn" type="button" id="navCopy"><svg class="ico"><use href="#i-copy"/></svg>Recopier</button></footer>
    </div>
  </section>

  <!-- Menus -->
  <div class="pop" id="listMenu" popover>
    <button type="button" data-act="new"><svg class="ico"><use href="#i-plus"/></svg>Nouvelle liste</button>
    <button type="button" data-act="rename"><svg class="ico"><use href="#i-pen"/></svg>Renommer</button>
    <hr>
    <button type="button" data-act="delete" class="danger"><svg class="ico"><use href="#i-trash"/></svg>Supprimer</button>
  </div>
  <div class="pop" id="rubMenu" popover>
    <button type="button" data-act="rename"><svg class="ico"><use href="#i-pen"/></svg>Renommer</button>
    <hr>
    <button type="button" data-act="delete" class="danger"><svg class="ico"><use href="#i-trash"/></svg>Supprimer</button>
  </div>
  <div class="pop" id="settingsMenu" popover>
    <button type="button" data-act="import"><svg class="ico"><use href="#i-down"/></svg>Importer</button>
    <button type="button" data-act="export-json"><svg class="ico"><use href="#i-up"/></svg>Exporter JSON</button>
    <button type="button" data-act="export-csv"><svg class="ico"><use href="#i-table"/></svg>Exporter CSV</button>
    <hr>
    <button type="button" data-act="theme"><svg class="ico"><use href="#i-moon"/></svg><span>Thème sombre</span></button>
  </div>

  <!-- Dialogue (renommer, confirmer, informer) -->
  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dlgTitle"></h2>
      <p id="dlgText"></p>
      <input id="dlgInput" autocomplete="off">
      <div class="dlg-acts">
        <button class="btn" value="cancel" id="dlgCancel" formnovalidate>Annuler</button>
        <button class="btn solid" value="ok" id="dlgOk">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="toastAction"></button></div>
  <input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" hidden>
</body>
</html>
