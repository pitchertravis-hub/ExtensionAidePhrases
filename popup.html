<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenText</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/Sortable.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V8M6 14l6-6 6 6M5 4h14"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="top">
      <div class="brand"><span class="mono-z">Z</span><span class="bname">ZenText</span></div>
      <label class="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="q" placeholder="Chercher une rubrique, une phrase ou un menu ID" autocomplete="off" aria-label="Recherche">
        <kbd id="kSlash">/</kbd>
        <button class="ibtn mic" type="button" id="micBtn" title="Recherche vocale"><svg class="ico"><use href="#i-mic"/></svg></button>
      </label>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabBtnPh" aria-selected="true"><svg class="ico"><use href="#i-text"/></svg>Phrases</button>
        <button type="button" role="tab" id="tabBtnId" aria-selected="false"><svg class="ico"><use href="#i-compass"/></svg><span>Navigation ID</span></button>
      </div>
      <button class="ibtn" type="button" id="settingsBtn" title="Réglages"><svg class="ico"><use href="#i-sliders"/></svg></button>
    </header>

    <aside class="side">
      <div class="listrow">
        <select id="listSelect" aria-label="Liste"></select>
        <button class="ibtn" type="button" id="listMenuBtn" title="Actions sur la liste"><svg class="ico"><use href="#i-dots"/></svg></button>
      </div>
      <ul class="nav" id="nav"></ul>
      <button class="add" type="button" id="addRubBtn"><svg class="ico"><use href="#i-plus"/></svg>Rubrique</button>
    </aside>

    <main class="main">
      <section class="pane" id="tabPh">
        <div class="mhead">
          <div class="t"><h1 id="mTitle"></h1><div class="sub" id="mSub"></div></div>
          <div class="sort" id="sortBox" role="group" aria-label="Ordre des phrases">
            <button type="button" data-s="order" aria-pressed="true">Mon ordre</button>
            <button type="button" data-s="used" aria-pressed="false">Plus utilisées</button>
          </div>
          <button class="btn solid" type="button" id="addPhBtn"><svg class="ico"><use href="#i-plus"/></svg>Phrase</button>
        </div>
        <div class="scroll" id="phList"></div>
      </section>
      <section class="pane" id="tabId" hidden>
        <div class="mhead">
          <div class="t"><h1>Navigation ID</h1><div class="sub">Cliquez un module, une option, puis une sous-option : la phrase est copiée.</div></div>
          <button class="ibtn" type="button" id="introBtn" title="Modifier la phrase d'introduction"><svg class="ico"><use href="#i-pen"/></svg></button>
        </div>
        <div class="nid" id="idBox"></div>
      </section>
    </main>

    <footer class="foot">
      <span class="k"><kbd>↑</kbd><kbd>↓</kbd> choisir</span>
      <span class="k"><kbd>Entrée</kbd> copier</span>
      <span class="k wide"><kbd>E</kbd> modifier</span>
      <span class="k wide"><kbd>F</kbd> favori</span>
      <span class="sp"></span>
      <small id="backupInfo"></small>
      <small id="version"></small>
    </footer>
  </div>

  <div class="pop" id="listMenu" popover>
    <button type="button" data-act="new"><svg class="ico"><use href="#i-plus"/></svg>Nouvelle liste</button>
    <button type="button" data-act="rename"><svg class="ico"><use href="#i-pen"/></svg>Renommer la liste</button>
    <hr>
    <button type="button" data-act="delete" class="danger"><svg class="ico"><use href="#i-trash"/></svg>Supprimer la liste</button>
  </div>
  <div class="pop" id="rubMenu" popover>
    <button type="button" data-act="rename"><svg class="ico"><use href="#i-pen"/></svg>Renommer</button>
    <hr>
    <button type="button" data-act="delete" class="danger"><svg class="ico"><use href="#i-trash"/></svg>Supprimer</button>
  </div>
  <div class="pop" id="settingsMenu" popover>
    <button type="button" data-act="panel"><svg class="ico"><use href="#i-panel"/></svg><span>Ancrer sur le côté</span></button>
    <button type="button" data-act="shortcut"><svg class="ico"><use href="#i-key"/></svg>Raccourci clavier…</button>
    <hr>
    <button type="button" data-act="import"><svg class="ico"><use href="#i-down"/></svg>Importer</button>
    <button type="button" data-act="export-json"><svg class="ico"><use href="#i-up"/></svg>Exporter JSON</button>
    <button type="button" data-act="export-csv"><svg class="ico"><use href="#i-table"/></svg>Exporter CSV</button>
    <hr>
    <button type="button" data-act="theme"><svg class="ico"><use href="#i-moon"/></svg><span>Thème sombre</span></button>
  </div>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dlgTitle"></h2>
      <p id="dlgText"></p>
      <input id="dlgInput" autocomplete="off">
      <div class="dlg-acts">
        <button class="btn" value="cancel" id="dlgCancel" formnovalidate>Annuler</button>
        <button class="btn solid" value="ok" id="dlgOk">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="toastAction"></button></div>
  <input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" hidden>
</body>
</html>
